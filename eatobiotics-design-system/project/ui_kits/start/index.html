.toolbar button{padding:8px 14px;border:none;background:transparent;font-size:12px;font-weight:600;color:#5A6E50;border-radius:8px;cursor:pointer;font-family:inherit}
.toolbar button.active{background:#1A2E12;color:#fff}
.toolbar .dot{display:inline-block;width:8px;height:8px;border-radius:9999px;margin-right:6px;vertical-align:middle}
.section-divider{height:4px;background:linear-gradient(90deg,#A8E063 0%,#4CB648 25%,#2DAA6E 50%,#F5C518 75%,#F5A623 100%)}

function App() {
  const [route, setRoute] = useState('family');
  const cfg = ROUTES[route];
  const ctaLabel = cfg.cta + ' →';

  return (
    <div>
      <div className="toolbar">
        {['core','family','mind'].map(r =>
          <button key={r} className={route===r?'active':''} onClick={()=>setRoute(r)}>
            <span className="dot" style={{background:ROUTES[r].accent}}/>/start{r==='core'?'':'-'+r}
          </button>)}
      </div>

      <div data-screen-label={`0${route==='core'?1:route==='family'?2:3} /start-${route}`}>
        <StartHero accent={cfg.accent} badge={cfg.badge}
          headline={cfg.headline} headlineAccent={cfg.headlineAccent}
          tension={cfg.tension} subhead={cfg.subhead} cta={cfg.cta+' →'}
          score={<ScoreMock {...cfg.score} accent={cfg.accent}/>}/>
        <div className="section-divider"/>
        <StartProblem accent={cfg.accent} h2={cfg.problemH2} opening={cfg.problemOpening}
          gaps={cfg.gaps} symptoms={cfg.symptoms} ctaLabel={ctaLabel}/>
        <StartSolution accent={cfg.accent} overline="THE SOLUTION" h2={cfg.solutionH2}
          sub={cfg.solutionSub} table={cfg.table} pillars={cfg.pillars} ctaLabel={ctaLabel}/>

}
