<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.c{position:relative;border:1px solid var(--border);border-radius:16px;padding:18px;overflow:hidden}
.bar{position:absolute;top:0;left:0;right:0;height:5px}
.num{font-family:var(--font-serif);font-size:52px;font-weight:600;line-height:1}
.t{font-family:var(--font-serif);font-size:17px;font-weight:600;margin-top:14px}
.s{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.p{font-size:12px;color:var(--muted-foreground);line-height:1.5;margin-top:8px}
</style></head><body>
<div class="row">
<div class="c"><div class="bar" style="background:linear-gradient(90deg,#A8E063,#4CB648)"></div><div class="num" style="color:#A8E063">01</div><div class="t">Prebiotics</div><div class="s" style="color:#A8E063">FEED</div><div class="p">Fibers and compounds that nourish gut bacteria.</div></div>
<div class="c"><div class="bar" style="background:linear-gradient(90deg,#4CB648,#2DAA6E)"></div><div class="num" style="color:#2DAA6E">02</div><div class="t">Probiotics</div><div class="s" style="color:#2DAA6E">ADD</div><div class="p">Living microorganisms from fermented foods.</div></div>
<div class="c"><div class="bar" style="background:linear-gradient(90deg,#F5C518,#F5A623)"></div><div class="num" style="color:#F5A623">03</div><div class="t">Postbiotics</div><div class="s" style="color:#F5A623">PRODUCE</div><div class="p">Beneficial byproducts your gut bacteria create.</div></div>
</div>
</body></html>
