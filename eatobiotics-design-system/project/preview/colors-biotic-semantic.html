<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.c{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:#fff}
.c .bar{height:6px}
.c .body{padding:14px 16px}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
.name{font-family:var(--font-serif);font-size:18px;font-weight:600;margin-top:4px;color:var(--foreground)}
.sub{font-size:11px;color:var(--muted-foreground);margin-top:2px}
</style></head><body>
<div class="row">
  <div class="c"><div class="bar" style="background:linear-gradient(90deg,#A8E063,#4CB648)"></div><div class="body"><div class="eyebrow" style="color:#A8E063">PREBIOTIC · FEED</div><div class="name">Prebiotic</div><div class="sub">--prebiotic / --icon-lime · #A8E063</div></div></div>
  <div class="c"><div class="bar" style="background:linear-gradient(90deg,#4CB648,#2DAA6E)"></div><div class="body"><div class="eyebrow" style="color:#2DAA6E">PROBIOTIC · ADD</div><div class="name">Probiotic</div><div class="sub">--probiotic / --icon-teal · #2DAA6E</div></div></div>
  <div class="c"><div class="bar" style="background:linear-gradient(90deg,#F5C518,#F5A623)"></div><div class="body"><div class="eyebrow" style="color:#F5A623">POSTBIOTIC · PRODUCE</div><div class="name">Postbiotic</div><div class="sub">--postbiotic / --icon-orange · #F5A623</div></div></div>
</div>
</body></html>
