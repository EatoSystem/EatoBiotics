<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.c{position:relative;border:1px solid var(--border);border-radius:20px;padding:16px 18px;background:#fff}
.n{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
.ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin:10px 0 10px;font-size:16px}
h3{font-family:var(--font-serif);font-size:15px;font-weight:600;margin:0 0 4px}
p{font-size:12px;color:var(--muted-foreground);margin:0;line-height:1.5}
</style></head><body>
<div class="row">
<div class="c" style="border-left:4px solid #A8E063;background:linear-gradient(160deg,rgba(168,224,99,.10),transparent 60%)"><div class="n" style="color:#A8E063">01</div><div class="ic" style="background:rgba(168,224,99,.15);color:#4CB648">✓</div><h3>Assess</h3><p>Answer 15 questions. Get your score.</p></div>
<div class="c" style="border-left:4px solid #4CB648;background:linear-gradient(160deg,rgba(76,182,72,.10),transparent 60%)"><div class="n" style="color:#4CB648">02</div><div class="ic" style="background:rgba(76,182,72,.15);color:#4CB648">◧</div><h3>Score</h3><p>5 pillars across your food system.</p></div>
<div class="c" style="border-left:4px solid #F5A623;background:linear-gradient(160deg,rgba(245,166,35,.10),transparent 60%)"><div class="n" style="color:#F5A623">03</div><div class="ic" style="background:rgba(245,166,35,.15);color:#F5A623">↗</div><h3>Improve</h3><p>Track streak, get meal plans, consult EatoBiotic.</p></div>
</div>
</body></html>
