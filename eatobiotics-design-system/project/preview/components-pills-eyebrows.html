<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:9999px;font-size:12px;font-weight:500;color:#fff}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px 6px 10px;border-radius:9999px;border:1px solid var(--border);background:#fff;font-size:12px;font-weight:600;color:var(--muted-foreground)}
.dot{width:8px;height:8px;border-radius:9999px}
</style></head><body>
<span class="pill" style="background:linear-gradient(135deg,#A8E063,#4CB648)">Leafy greens</span>
<span class="pill" style="background:linear-gradient(135deg,#4CB648,#2DAA6E)">Kimchi</span>
<span class="pill" style="background:linear-gradient(135deg,#F5C518,#F5A623)">Salmon</span>
<span class="chip"><span class="dot" style="background:linear-gradient(135deg,#A8E063,#4CB648)"></span>Core Pathway</span>
<span class="eyebrow" style="color:var(--icon-green)">THE ECOSYSTEM</span>
<span class="eyebrow" style="color:var(--icon-orange)">MEMBERSHIP</span>
</body></html>
