<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);display:flex;justify-content:center;align-items:center}
.ring{position:relative;width:180px;height:180px}
.num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.n{font-family:var(--font-serif);font-size:56px;font-weight:700;color:var(--foreground);line-height:1}
.sm{font-size:11px;color:var(--muted-foreground);margin-top:2px}
.tag{margin-top:4px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#4CB648}
.meta{margin-left:32px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted-foreground);margin-bottom:6px}
h3{font-family:var(--font-serif);font-size:20px;font-weight:600;margin:0 0 4px}
p{font-size:13px;color:var(--muted-foreground);margin:0;max-width:260px;line-height:1.5}
</style></head><body>
<div class="ring">
<svg width="180" height="180" viewBox="0 0 200 200" style="transform:rotate(-90deg)">
<defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#A8E063"/><stop offset="25%" stop-color="#4CB648"/><stop offset="60%" stop-color="#2DAA6E"/><stop offset="80%" stop-color="#F5C518"/><stop offset="100%" stop-color="#F5A623"/></linearGradient></defs>
<circle cx="100" cy="100" r="88" fill="none" stroke="#E5E5E5" stroke-width="11"/>
<circle cx="100" cy="100" r="88" fill="none" stroke="url(#g)" stroke-width="11" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="122"/>
</svg>
<div class="num"><div class="n">78</div><div class="sm">/100</div><div class="tag">GREAT PROGRESS</div></div>
</div>
<div class="meta">
<div class="eyebrow">BIOTICS SCORE</div>
<h3>Animated progress ring</h3>
<p>0–100 score. Gradient stroke. Counter animates 0→N over 1s. Used in the app header and assessment results.</p>
</div>
</body></html>
