<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:0;background:#fff;font-family:var(--font-sans)}
.hero{padding:80px 40px;text-align:center;background:#1A2E12}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#A8E063}
h1{font-family:var(--font-serif);font-size:44px;font-weight:700;line-height:1.05;margin:14px 0 10px;color:#fff}
.grad{background:linear-gradient(135deg,#A8E063,#4CB648,#2DAA6E,#F5C518,#F5A623);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
p{color:rgba(255,255,255,.6);font-size:14px;margin:10px auto 0;max-width:520px}
</style></head><body>
<div class="hero">
<div class="eyebrow">THE MISSION</div>
<h1><span class="grad">Build the food system inside you…</span><br>and help build the food system around you.</h1>
<p>Signature dark-ground composition — gradient clause over a deep green-black field.</p>
</div>
</body></html>
