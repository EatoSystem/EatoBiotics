<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px}
.c{position:relative;border:1px solid var(--border);border-radius:20px;padding:18px;background:#fff}
.c.hl{border:2px solid color-mix(in srgb,#4CB648 40%,#E5E5E5)}
.bar{height:4px;border-radius:9999px;margin-bottom:14px}
.n{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px}
.price{font-family:var(--font-serif);font-size:19px;font-weight:700;margin-bottom:10px}
.line{display:flex;gap:6px;font-size:12px;color:var(--muted-foreground);margin-bottom:14px;line-height:1.4}
.btn{display:block;text-align:center;padding:9px 12px;border-radius:9999px;color:#fff;font-size:12px;font-weight:600}
</style></head><body>
<div class="row">
<div class="c"><div class="bar" style="background:linear-gradient(90deg,#A8E063,#4CB648)"></div><div class="n" style="color:#A8E063">FREE</div><div class="price">Free</div><div class="line">✓ Biotics Score + assessment</div><div class="btn" style="background:linear-gradient(135deg,#A8E063,#4CB648)">Start Free →</div></div>
<div class="c hl"><div class="bar" style="background:linear-gradient(90deg,#A8E063,#4CB648)"></div><div class="n" style="color:#4CB648">GROW</div><div class="price">€9.99/mo</div><div class="line">✓ Daily logging + streak</div><div class="btn" style="background:linear-gradient(135deg,#A8E063,#4CB648)">See Plan →</div></div>
<div class="c"><div class="bar" style="background:linear-gradient(90deg,#2DAA6E,#F5A623)"></div><div class="n" style="color:#F5A623">TRANSFORM</div><div class="price">€99/mo</div><div class="line">✓ Unlimited EatoBiotic consults</div><div class="btn" style="background:linear-gradient(135deg,#2DAA6E,#F5A623)">See Plan →</div></div>
</div>
</body></html>
