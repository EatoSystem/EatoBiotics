<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans)}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.c{border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.c .sw{height:56px}
.c .meta{padding:8px 10px}
.c .name{font-size:12px;font-weight:600;color:var(--foreground)}
.c .hex{font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground);margin-top:1px}
.title{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground);margin-bottom:10px}
</style></head><body>
<div class="title">Neutrals / UI Palette</div>
<div class="row">
  <div class="c"><div class="sw" style="background:#FFFFFF;border-bottom:1px solid var(--border)"></div><div class="meta"><div class="name">background</div><div class="hex">#FFFFFF</div></div></div>
  <div class="c"><div class="sw" style="background:#F7F7F7"></div><div class="meta"><div class="name">secondary</div><div class="hex">#F7F7F7</div></div></div>
  <div class="c"><div class="sw" style="background:#F3F3F3"></div><div class="meta"><div class="name">muted</div><div class="hex">#F3F3F3</div></div></div>
  <div class="c"><div class="sw" style="background:#E5E5E5"></div><div class="meta"><div class="name">border</div><div class="hex">#E5E5E5</div></div></div>
  <div class="c"><div class="sw" style="background:#5A6E50"></div><div class="meta"><div class="name">muted-fg</div><div class="hex">#5A6E50</div></div></div>
  <div class="c"><div class="sw" style="background:#1A2E12"></div><div class="meta"><div class="name">foreground</div><div class="hex">#1A2E12</div></div></div>
</div>
</body></html>
