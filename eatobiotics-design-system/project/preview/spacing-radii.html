<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans)}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.c{text-align:center}
.box{background:var(--foreground);margin:0 auto}
.lbl{margin-top:6px;font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground)}
.nm{font-size:11px;font-weight:600;margin-top:2px}
.title{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground);margin-bottom:14px}
</style></head><body>
<div class="title">Corner Radius Scale</div>
<div class="row">
  <div class="c"><div class="box" style="width:56px;height:56px;border-radius:8px"></div><div class="nm">sm</div><div class="lbl">8px</div></div>
  <div class="c"><div class="box" style="width:56px;height:56px;border-radius:10px"></div><div class="nm">md</div><div class="lbl">10px</div></div>
  <div class="c"><div class="box" style="width:56px;height:56px;border-radius:12px"></div><div class="nm">lg</div><div class="lbl">12px</div></div>
  <div class="c"><div class="box" style="width:56px;height:56px;border-radius:16px"></div><div class="nm">xl</div><div class="lbl">16px</div></div>
  <div class="c"><div class="box" style="width:56px;height:56px;border-radius:24px"></div><div class="nm">2xl</div><div class="lbl">24px</div></div>
  <div class="c"><div class="box" style="width:56px;height:56px;border-radius:9999px"></div><div class="nm">full</div><div class="lbl">pill</div></div>
</div>
</body></html>
