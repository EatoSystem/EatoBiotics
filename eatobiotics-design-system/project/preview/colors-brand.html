<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:#fff}
.sw{display:flex;gap:0;border-radius:14px;overflow:hidden;border:1px solid var(--border);height:96px}
.s{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px;color:#fff;font-family:var(--font-sans);font-size:11px;font-weight:600}
.s b{font-family:var(--font-mono);font-weight:400;opacity:.75;font-size:10px;margin-top:2px;letter-spacing:-.01em}
.title{font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground);margin-bottom:10px}
</style></head><body>
<div class="title">Brand Gradient Palette — 5 stops</div>
<div class="sw">
  <div class="s" style="background:#A8E063;color:#1A2E12">lime<b>#A8E063</b></div>
  <div class="s" style="background:#4CB648">green<b>#4CB648</b></div>
  <div class="s" style="background:#2DAA6E">teal<b>#2DAA6E</b></div>
  <div class="s" style="background:#F5C518;color:#1A2E12">yellow<b>#F5C518</b></div>
  <div class="s" style="background:#F5A623">orange<b>#F5A623</b></div>
</div>
<div style="margin-top:14px;height:14px;border-radius:9999px;background:var(--brand-gradient-h)"></div>
</body></html>
