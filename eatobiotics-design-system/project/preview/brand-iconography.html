<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>body{margin:0;padding:22px;background:#fff;font-family:var(--font-sans)}
.row{display:grid;grid-template-columns:repeat(8,1fr);gap:14px;text-align:center}
.c i{display:inline-flex;width:40px;height:40px;align-items:center;justify-content:center;color:var(--foreground)}
.lbl{font-size:10px;color:var(--muted-foreground);margin-top:4px;font-family:var(--font-mono)}
.note{font-size:11px;color:var(--muted-foreground);margin-top:14px;text-align:center}
</style></head><body>
<div class="row">
<div class="c"><i data-lucide="leaf"></i><div class="lbl">leaf</div></div>
<div class="c"><i data-lucide="brain"></i><div class="lbl">brain</div></div>
<div class="c"><i data-lucide="book-open"></i><div class="lbl">book-open</div></div>
<div class="c"><i data-lucide="smartphone"></i><div class="lbl">smartphone</div></div>
<div class="c"><i data-lucide="utensils"></i><div class="lbl">utensils</div></div>
<div class="c"><i data-lucide="activity"></i><div class="lbl">activity</div></div>
<div class="c"><i data-lucide="apple"></i><div class="lbl">apple</div></div>
<div class="c"><i data-lucide="users"></i><div class="lbl">users</div></div>
<div class="c"><i data-lucide="arrow-right"></i><div class="lbl">arrow-right</div></div>
<div class="c"><i data-lucide="arrow-up-right"></i><div class="lbl">up-right</div></div>
<div class="c"><i data-lucide="chevron-down"></i><div class="lbl">chevron</div></div>
<div class="c"><i data-lucide="check"></i><div class="lbl">check</div></div>
<div class="c"><i data-lucide="clipboard-list"></i><div class="lbl">clipboard</div></div>
<div class="c"><i data-lucide="bar-chart-2"></i><div class="lbl">bar-chart</div></div>
<div class="c"><i data-lucide="trending-up"></i><div class="lbl">trending</div></div>
<div class="c"><i data-lucide="mic"></i><div class="lbl">mic</div></div>
</div>
<div class="note">Lucide icons · 2px stroke · color inherits from text · sizes 14–26px</div>
<script>lucide.createIcons();</script>
</body></html>
