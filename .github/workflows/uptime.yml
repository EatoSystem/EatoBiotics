name: Uptime

# Best-effort scheduled smoke test of the live site's key pages + health check.
# No-ops until MONITOR_BASE_URL is set (so it stays dormant until launch).
on:
  schedule:
    - cron: "*/30 * * * *" # every ~30 minutes
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check key pages
        env:
          BASE_URL: ${{ vars.MONITOR_BASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ vars.MONITOR_ALERT_EMAIL }}
          ALERT_FROM: ${{ vars.MONITOR_ALERT_FROM }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "MONITOR_BASE_URL not set — skipping (configure it after launch)."
            exit 0
          fi
          fail=""
          for path in "/" "/assessment" "/pricing" "/api/health"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$BASE_URL$path" || echo "000")
            echo "$path -> $code"
            [ "$code" != "200" ] && fail="$fail $path($code)"
          done
          if [ -n "$fail" ]; then
            echo "FAILING:$fail"
            if [ -n "$RESEND_API_KEY" ] && [ -n "$ALERT_TO" ] && [ -n "$ALERT_FROM" ]; then
              curl -s -X POST https://api.resend.com/emails \
                -H "Authorization: Bearer $RESEND_API_KEY" \
                -H "Content-Type: application/json" \
                -d "{\"from\":\"$ALERT_FROM\",\"to\":\"$ALERT_TO\",\"subject\":\"⚠️ EatoBiotics uptime alert\",\"text\":\"Failing pages:$fail on $BASE_URL\"}" > /dev/null
              echo "Alert email sent."
            fi
            exit 1
          fi
          echo "All key pages returned 200."
