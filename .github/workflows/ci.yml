name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npx next build
        env:
          # Dummy values so module-load + build succeed in CI (no real secrets).
          STRIPE_SECRET_KEY: sk_test_ci_dummy
          STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy
          ANTHROPIC_API_KEY: sk-ant-ci-dummy
          RESEND_API_KEY: re_ci_dummy
          EMAIL_FROM: ci@example.com
          OWNER_EMAIL: ci@example.com
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy
          ADMIN_PASSWORD: ci-dummy
          CRON_SECRET: ci-dummy
