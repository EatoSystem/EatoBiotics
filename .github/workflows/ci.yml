name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npx tsc --noEmit
      - name: Supabase scoping check
        run: node scripts/check-supabase-scoping.mjs
      - name: Production build
        run: npx next build
        # No secrets needed: SDK clients are constructed lazily (see lib/stripe-server.ts,
        # lib/anthropic.ts). The build must succeed without any env configured.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Accessibility smoke (axe-core over 20 representative pages)
        run: npx playwright test
        # Reuses the build above (playwright.config.ts webServer runs `next start`
        # with the preview gate disabled). Critical violations fail; serious ones
        # are report-only in the log until the existing backlog is cleared.
